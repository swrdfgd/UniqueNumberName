*{

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial, sans-serif;

    background:
    radial-gradient(circle at 20% 20%,#ffd93d55 0%,transparent 20%),
    radial-gradient(circle at 80% 30%,#ff5ea855 0%,transparent 20%),
    radial-gradient(circle at 30% 80%,#60a5fa55 0%,transparent 20%),

}

.card{
    width:100%;
    max-width:800px;

    background:white;
    border-radius:30px;
    padding:30px;

    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.pumpkin{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:200px;
    padding:15px;
    border-radius:15px;
    border:3px solid #ffd93d;
    font-size:18px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        var(--c1),
        var(--c2),
        var(--c3),
        var(--c4),
        var(--c5),
        var(--c6)
    );

    background-size:400%;
    animation:rainbow 6s linear infinite;
}

@keyframes rainbow{
    from{background-position:0%}
    to{background-position:100%}
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:20px;
    background:#fff8e6;
}

.output{
    font-size:34px;
    font-weight:bold;
    color:#ff5ea8;
    word-break:break-word;
}

.info{
    margin-top:15px;
    line-height:1.8;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#ffd93d;
}

@media(max-width:600px){

    .output{
        font-size:24px;
    }

    button{
        width:100%;
    }

}

</style>

linkers = ['nya','nya','di','te','de','ver','de','ma','heg','mi']

function numConv(n,triple=0){
	if (n === '111'){return "Unyan"}
	if (n === '108'){return "Unanogger"}
	if (n === '118'){return "Unanagger"}



    let  a,b,c,family,name
    if(n.length==1){
		c = parseInt(n[0]);
		family = kanokis2[c];

		name = family.single;
		return name;
    }


    if(n.length==2){
		b = parseInt(n[0]);
		c = parseInt(n[1]);
		family = kanokis2[b];

		name = family.right[c];
        return name;
    }

    a = parseInt(n[0]);
    b = parseInt(n[1]);
    c = parseInt(n[2]);

    family = kanokis[b];

    name =
        family.left[a]
        + family.core
        + family.right[c];
	
	return name;

}

function generate(){
	 let n = '' + 
        document.getElementById("number")
        .value
	
	let hasil = "";
	
	while (n.length > 3){
		let M = n.substring(n.length-3,n.length)
		hasil = numConv('' + Number(M)) + hasil;
		n = n.substring(0,n.length-3);
		hasil = " " + linkers[n[n.length-1]] + " " + hasil;
	}
	if (n.length > 0){
		hasil = numConv('' + n) + hasil;
	}
	
	document.getElementById("output").textContent = hasil;
}
